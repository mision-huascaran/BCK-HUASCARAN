# Análisis de SonarQube (ramas qa y uat, ver Jenkinsfile). La clave del proyecto
# hay que confirmarla con los TA.
sonar.projectKey=BCK-HUASCARAN
sonar.projectName=BCK-HUASCARAN
sonar.sourceEncoding=UTF-8

sonar.sources=app,alembic
sonar.tests=tests
sonar.python.version=3.11
# Informe que genera el stage de pruebas con pytest-cov.
sonar.python.coverage.reportPaths=coverage.xml
# Migraciones y script de datos de prueba: no son lógica de la aplicación.
sonar.coverage.exclusions=alembic/**,app/seed_data.py
